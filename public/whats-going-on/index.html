<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeriah Labs: What's Going On?</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #2b2b2b; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        #game-container { 
            position: relative; 
            width: 800px; 
            height: 600px; 
            border-radius: 15px; 
            overflow: hidden; 
            background: #000; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        #game-image { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: filter 0.5s ease; /* Smooth dimming effect */
        }
        #question-container { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            width: 80%; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 30px; 
            border-radius: 15px; 
            text-align: center; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.4); 
        }
        h2 { 
            margin-top: 0; 
            color: #333; 
        }
        .option-btn { 
            display: block; 
            width: 100%; 
            padding: 15px; 
            margin: 10px 0; 
            font-size: 1.1rem; 
            border: none; 
            border-radius: 8px; 
            background: #4CAF50; 
            color: white; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        .option-btn:hover { 
            background: #45a049; 
        }
        #start-screen { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.8); 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            color: white; 
            z-index: 10; 
        }
        #start-btn { 
            padding: 15px 40px; 
            font-size: 1.5rem; 
            background: #FF9800; 
            border: none; 
            border-radius: 10px; 
            color: white; 
            cursor: pointer; 
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <img id="game-image" src="" alt="Game Image" />
        
        <div id="start-screen">
            <h1>What's Going On?</h1>
            <p>Take a mental snapshot! You have 7 seconds.</p>
            <button id="start-btn" onclick="initGame()">Load Game</button>
        </div>

        <div id="question-container" style="display: none;">
            <h2 id="question-text">Question goes here</h2>
            <div id="options-container">
                <button class="option-btn" onclick="checkAnswer(0)" id="opt-0">Option 1</button>
                <button class="option-btn" onclick="checkAnswer(1)" id="opt-1">Option 2</button>
                <button class="option-btn" onclick="checkAnswer(2)" id="opt-2">Option 3</button>
            </div>
        </div>
    </div>

    <script src="engine.js"></script>
</body>
</html>
