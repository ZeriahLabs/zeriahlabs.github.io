<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hello World | Zeriah Labs</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- Core Zeriah Labs Styles (Absolute Path) -->
  <link rel="stylesheet" href="/css/style.css">
  
  <style>
    /* ----------------------------------------- */
    /* MODULE SPECIFIC STYLES GO HERE            */
    /* ----------------------------------------- */
    .game-board {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border-radius: 24px;
      padding: 30px;
      border: 4px solid var(--brand);
      box-shadow: 0 10px 40px rgba(0, 208, 255, 0.2);
      text-align: center;
      margin-top: 20px;
    }
    .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .game-title { margin: 0; font-size: 2rem; font-weight: 900; color: var(--brand2); }
    .score-tracker { background: rgba(255, 255, 255, 0.1); padding: 10px 20px; border-radius: 99px; font-size: 1.2rem; font-weight: 900; color: #fff; }
    
    .primary-btn {
      background-color: var(--brand); 
      color: #07101a; 
      border: none;
      padding: 15px 40px;
      font-size: 1.5rem;
      border-radius: 12px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 20px;
      transition: transform 0.1s;
    }
    .primary-btn:active { transform: scale(0.95); }
    .primary-btn:disabled { background-color: var(--rule); cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- UNIFIED ZERIAH LABS HEADER -->
  <header>
    <div class="wrap nav">
      <a href="/index.html" class="brand">
        <img src="https://assets.zeriahlabs.com/Zeriah_Labs_Vertical_Final.webp" alt="Zeriah Labs logo" style="height:36px;">
        <span>Zeriah Labs</span>
      </a>
      <!-- auth.js handles the user badge injection here -->
      <div class="user-badge" style="display: none;" id="user-badge-container">
          <span>👤 <span id="nav-username"></span></span>
          <span class="logout-btn" onclick="logout()" style="cursor:pointer; color:var(--brand); margin-left:10px;">[Logout]</span>
      </div>
      <a href="javascript:void(0)" id="login-btn" class="links primary" style="padding:8px 16px; border-radius:12px; font-weight:700; text-decoration:none;">Sign In / Register</a>
    </div>
  </header>

  <main class="wrap dashboard-layout">
    <section>
      <a href="/index.html" style="color: var(--brand); text-decoration: none; font-weight: 700;">← Back to Dashboard</a>
      
      <!-- MAIN GAME BOARD -->
      <div class="game-board">
        <div class="game-header">
          <h2 class="game-title">Hello World Module</h2>
          <div class="score-tracker">
            ⏱ <span id="time" style="color: var(--brand2);">60</span>s &nbsp;|&nbsp; ⭐ <span id="score" style="color: var(--brand);">0</span>
          </div>
        </div>

        <!-- 1. START SCREEN -->
        <div id="start-screen" style="padding: 20px 0;">
          <h3 style="color: #eef6ff; font-size: 1.5rem; margin-bottom: 30px;">Ready to play?</h3>
          <button id="start-btn" class="primary-btn" onclick="startGame()">Start Game</button>
        </div>

        <!-- 2. PLAY SCREEN -->
        <div id="game-screen" style="display: none; padding: 20px 0;">
            <h2 id="main-display" style="color: #eef6ff; font-size: 2rem; margin-bottom: 30px;">Click the button!</h2>
            <button class="primary-btn" onclick="scorePoint()" style="background-color: var(--brand2);">Score Point</button>
        </div>

        <!-- 3. GAME OVER SCREEN -->
        <div id="game-over-screen" style="display: none; padding: 40px 0;">
            <h1 style="color: #fff; font-size: 3rem; margin-bottom: 10px;">Time's Up!</h1>
            <h2 style="color: #eef6ff; margin-bottom: 20px;">Final Score: <span id="final-score" style="color: var(--brand);">0</span></h2>
            <button class="primary-btn" onclick="startGame()">Play Again</button>
        </div>
      </div>
    </section>

    <!-- ACHIEVEMENTS PANEL -->
    <aside class="achievements-panel">
        <h2>🏆 Achievements</h2>
        <div class="user-progress">
          <div style="display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700;">
            <span id="levelText">Level 1 Rookie</span>
            <span id="xpText" style="color: var(--brand);">0 / 1000 XP</span>
          </div>
          <div class="xp-bar"><div class="xp-fill" id="xpBarFill" style="width: 0%;"></div></div>
        </div>
        
        <div class="achievement-list" id="achievementsList">
          <!-- Achievements will be dynamically rendered here by auth.js/engine -->
          <div class="achievement-item locked">
            <div class="achievement-badge">🎯</div>
            <div class="achievement-info">
              <h4>First Click</h4>
              <p>Score your first point.</p>
            </div>
            <div class="achievement-points">50 XP</div>
          </div>
        </div>
    </aside>
  </main>

  <!-- Audio Elements -->
  <audio id="sound-correct" src="/sounds/yay.mp3"></audio>
  <audio id="bgm" src="/sounds/bgm.mp3" loop></audio>

  <!-- Global Scripts & Module Engine -->
  <script src="/js/auth.js"></script>
  <script src="/js/hello-engine.js"></script>

</body>
</html>
