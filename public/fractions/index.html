<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Fractions Game</title>
    <!-- Change this in index.html -->
    <link rel="stylesheet" href="./public/css/style.css">
</head>
<body>

    <!-- Native Header Integration -->
    <header>
        <div class="wrap nav">
            <div class="brand-container">
                <span class="brand">ZERIAH LABS</span>
            </div>
            <div class="links">
                <a href="#" class="back-link">← Back</a>
            </div>
        </div>
    </header>

    <div class="wrap">
        <!-- Start screen to bypass audio restrictions -->
        <div id="start-screen">
            <h1>Pizza Fractions</h1>
            <button id="start-btn" class="choice-btn">Start Game</button>
        </div>

        <!-- The game container -->
        <div id="game-container" style="display: none;">
            <div id="question-text">2/6 + 2/6 = ?</div>
            <div id="visual-area"></div>
            <div id="choices-area"></div>
            <div id="score-board">Score: <span id="score">0</span></div>
        </div>
    </div>

    <script src="fractions-engine.js"></script>
</body>
</html>
