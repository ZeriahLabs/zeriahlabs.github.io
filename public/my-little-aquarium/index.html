<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeriah Labs: Sandbox Aquarium</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-top: 20px; font-weight: 300; }
        
        /* The Game Canvas Wrapper */
        #game-container {
            border: 4px solid #4a4e69;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        /* The Drawing Modal */
        #draw-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }
        #drawing-pad {
            background: white;
            border-radius: 8px;
            cursor: crosshair;
        }
        .btn {
            background: #00b4d8;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 10px;
            transition: background 0.2s;
        }
        .btn:hover { background: #0096c7; }
        .controls { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <h1>🐠 Zeriah Labs: Zen Aquarium</h1>
    
    <div class="controls">
        <button class="btn" onclick="openDrawPad()">🎨 Draw an Object</button>
        <button class="btn" onclick="clearTank()" style="background: #ef233c;">🗑️ Clear Tank</button>
    </div>

    <div id="game-container"></div>

    <div id="draw-modal">
        <h2>Draw a solid object for your tank!</h2>
        <canvas id="drawing-pad" width="150" height="150"></canvas>
        <div class="controls">
            <button class="btn" onclick="saveDrawing()">Drop into Tank!</button>
            <button class="btn" onclick="closeDrawPad()" style="background: #8d99ae;">Cancel</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. THE PHASER GAME ENGINE (The Aquarium)
        // ==========================================
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 500,
            parent: 'game-container',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 200 }, // Gravity for dropped items
                    debug: false
                }
            },
            scene: { preload, create, update }
        };

        const game = new Phaser.Game(config);
        let fish;
        let mainScene;

        function preload() {
            // We use standard Phaser shapes for the prototype to avoid needing external images!
        }

        function create() {
            mainScene = this;
            
            // Draw Water Background
            this.add.rectangle(400, 250, 800, 500, 0x0077b6);
            
            // Create a procedural "Fish" (Orange rectangle for prototype)
            fish = this.add.rectangle(400, 250, 60, 30, 0xf77f00);
            this.physics.add.existing(fish);
            fish.body.allowGravity = false; // Fish float!
            fish.body.collideWorldBounds = true;
            fish.body.setBounce(1);
            
            // Give the fish a lazy swimming velocity
            fish.body.setVelocity(50, 20);

            // Add boundaries to the bottom so items don't fall forever
            this.physics.world.setBoundsCollision(true, true, true, true);

            // Load saved drawings from LocalStorage
            loadSavedItems();
        }

        function update() {
            // Simple AI: If fish hits a wall, gently reverse direction
            if (fish.body.velocity.x === 0) fish.body.setVelocityX(Phaser.Math.Between(-60, 60));
            if (fish.body.velocity.y === 0) fish.body.setVelocityY(Phaser.Math.Between(-30, 30));
        }

        // --- Custom Logic: Injecting Drawings into the Engine ---
        function spawnCustomItem(base64String) {
            let img = new Image();
            img.src = base64String;
            img.onload = () => {
                let textureKey = 'custom_' + Date.now();
                // Add the loaded image as a Phaser texture
                mainScene.textures.addImage(textureKey, img);
                
                // Spawn it at the top of the tank
                let item = mainScene.physics.add.sprite(Phaser.Math.Between(100, 700), -50, textureKey);
                item.setCollideWorldBounds(true);
                item.setBounce(0.2);
                item.setDrag(50); // Water resistance
                
                // Make the fish gently bump into drawn items
                mainScene.physics.add.collider(fish, item);
            };
        }

        // ==========================================
        // 2. THE HTML5 CANVAS (The Drawing Pad)
        // ==========================================
        const modal = document.getElementById('draw-modal');
        const canvas = document.getElementById('drawing-pad');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        // Mouse Events for drawing
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        });
        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing) {
                ctx.lineTo(e.offsetX, e.offsetY);
                ctx.strokeStyle = '#2b2d42'; // Dark color for drawing
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.stroke();
            }
        });
        canvas.addEventListener('mouseup', () => isDrawing = false);

        function openDrawPad() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear pad
            modal.style.display = 'flex';
        }

        function closeDrawPad() {
            modal.style.display = 'none';
        }

        // ==========================================
        // 3. LOCAL STORAGE SAVING & LOADING
        // ==========================================
        function saveDrawing() {
            // Convert canvas drawing to Base64 Text String
            const base64Data = canvas.toDataURL('image/png');
            
            // Save to LocalStorage
            let savedItems = JSON.parse(localStorage.getItem('zeriah_tank')) || [];
            savedItems.push(base64Data);
            localStorage.setItem('zeriah_tank', JSON.stringify(savedItems));

            // Tell Phaser to spawn it instantly
            spawnCustomItem(base64Data);
            closeDrawPad();
        }

        function loadSavedItems() {
            let savedItems = JSON.parse(localStorage.getItem('zeriah_tank')) || [];
            savedItems.forEach(base64Data => {
                spawnCustomItem(base64Data);
            });
        }

        function clearTank() {
            localStorage.removeItem('zeriah_tank');
            location.reload(); // Quick refresh to clear the engine
        }
    </script>
</body>
</html>
